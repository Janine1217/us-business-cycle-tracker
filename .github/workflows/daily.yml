# 每天台灣時間 08:00：抓資料 → 更新儀表板 → 部署到 GitHub Pages
# （階段 4 會再加上「判斷是否寄提醒信」）
name: 每日更新儀表板

on:
  schedule:
    - cron: "0 0 * * *"        # UTC 00:00 = 台灣時間 08:00（GitHub 排程可能延遲數分鐘到一小時）
  workflow_dispatch:           # 可在 Actions 頁面手動按「Run workflow」
  push:
    branches: [main]
    paths: ["web/**", "tracker/**", "config.yaml", "run.py", ".github/workflows/daily.yml"]

permissions:
  contents: write              # 把每天抓到的資料存回 repo（data/ 資料夾）
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取資料
        id: fetch
        continue-on-error: true    # 部分資料失敗時，儀表板仍要照常更新
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py fetch

      - name: 產生儀表板
        run: python run.py build

      - name: 保存歷史資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
