# 每天台灣時間 08:00：抓資料 → 更新儀表板 → 判斷是否寄提醒信 → 部署到 GitHub Pages
# 任何步驟失敗、且連續失敗達到 config.yaml 的 failure_alert_after_runs 次，寄系統異常通知
name: 每日更新儀表板

on:
  schedule:
    - cron: "0 0 * * *"        # UTC 00:00 = 台灣時間 08:00（GitHub 排程可能延遲數分鐘到一小時）
  workflow_dispatch:           # 可在 Actions 頁面手動按「Run workflow」
    inputs:
      test_email:
        description: "寄一封測試提醒信（確認 Email 設定）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "tracker/**", "config.yaml", "run.py", ".github/workflows/daily.yml", "docs/待調整事項.md"]

permissions:
  contents: write              # 把每天抓到的資料存回 repo（data/ 資料夾）
  actions: read                # 查詢過去幾次執行是否失敗（系統異常通知用）
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取資料
        id: fetch
        continue-on-error: true    # 部分資料失敗時，儀表板仍要照常更新
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py fetch

      - name: 產生儀表板
        run: python run.py build

      - name: 判斷是否寄提醒信
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python run.py notify
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python run.py test-email | tee test_email.log
            grep -q "已寄出" test_email.log || { echo "::error::測試信沒有寄出，請檢查 SMTP_USER、SMTP_PASSWORD"; exit 1; }
          fi

      - name: 保存歷史資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 排程失敗時寄系統異常通知
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tracker.mailer crash
