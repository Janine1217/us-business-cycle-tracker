# 美國景氣循環追蹤系統：設定檔
# 修改這個檔案就能調整指標、參數與規則，不需要改程式碼。
# 「kind」決定變化幅度的單位：rate＝百分比類（百分點 pp）、level＝數值類（%）、index＝指數類（點數）

settings:
  observation_start: "1975-01-01"   # 抓資料起點（比回測早 10 年，供 24 個月回看與年增率計算）
  backtest_start: "1985-01-01"      # 回測與繪圖起點
  daily_view_years: 3               # 趨勢圖「日資料／週資料」檢視放最近幾年（只影響畫面，不影響階段判定）
  utc_offset_hours: 8               # 台灣時間
  run_time: "08:00"                 # 每日執行時間（台灣時間），實際排程寫在 .github/workflows/daily.yml
  failure_alert_after_runs: 2       # 整個排程連續失敗幾次就寄系統異常通知
  run_failure_ratio: 0.5            # 單次執行有超過這個比例的序列抓取失敗，視為「整個排程失敗」
  shiller:
    page: "https://shillerdata.com/"                                   # 先從這頁找最新檔案連結
    fallback_url: "http://www.econ.yale.edu/~shiller/data/ie_data.xls"  # 備援（2023-09 後未更新）

# ── Email 提醒（第 4 階段）──────────────────────────────────────
# 寄件帳號與密碼放在 GitHub Secrets（SMTP_USER、SMTP_PASSWORD），不寫在這裡
email:
  dashboard_url: "https://janine1217.github.io/us-business-cycle-tracker/"
  # 收件人：這個 repo 是公開的，寫在這裡的地址任何人都看得到。
  # 留空 [] ＝寄給 SMTP_USER 自己；想寄給別人又不想公開，改在 GitHub Secrets 加 MAIL_TO（多個用逗號分隔）
  recipients: []
  keep_days: 7                      # 寄信失敗時保留變化，超過幾天的舊變化就不再補寄

# ── 股市多轉空風險分數（和景氣階段分開計算，不影響階段判定）──────────────
# ── 即時資料回測（ALFRED：FRED 歷史版本資料庫）──
# 每個月月底只用「當時已公布的版本」重跑階段判定，評估資料修正的影響（docs/即時回測.md）。
# 每月 1 日由每日排程順便執行（約 10 分鐘），也可手動：python run.py realtime
# series：會被修正、要抓完整版本的序列；snapshot：每週全部重估、資料量太大，只抓每月月底版本
# 市場價格類（利率、油價、股價、VIX）與 Shiller 資料不會被修正，沿用目前數值。
realtime_backtest:
  run_day: 1
  series: [ADXTNO, BOPTIMP, CFNAIMA3, CPILFESL, DGDSRA3M086SBEA, DGORDER, DPCERA3M086SBEA, DRCLACBS, DRBLACBS,
           DSPI, DSPIC96, FGRECPT, GACDFSA066MSFRBPHI, GDPC1, GPDIC1, IC4WSA, IMPGS, JTSJOL, PCE, PCECC96,
           PNFI, PPIACO, PRFI, RRSFS, SAHMREALTIME, SLEXPND, UEMPLT5, UMCSENT, W023RC1Q027SBEA]
  snapshot: [NFCI, NFCIRISK]
  not_published_before: {NFCI: "2011-05", NFCIRISK: "2012-07"}   # 指數首次公布前當作不存在（嚴格版）
  # 用來比較「初值 vs 修正後」的序列：[代碼, 名稱, 比較期數, 年化次方（季資料 4，月資料不年化留空）]
  revision_table:
    - [GDPC1, 實質 GDP 季增年化, 3, 4]
    - [PCECC96, 實質消費 季增年化, 3, 4]
    - [GPDIC1, 實質民間投資 季增年化, 3, 4]
    - [DGORDER, 耐久財訂單 年增率, 12, null]
    - [RRSFS, 實質零售銷售 年增率, 12, null]
    - [DSPIC96, 實質可支配所得 年增率, 12, null]
    - [UEMPLT5, 短期失業人數 年增率, 12, null]

# 每個條件成立得 weight 分，總分換算成 0–100，再取 smooth_months 個月平均。
# type：lead＝領先型（通常在股市高點前出現）、confirm＝確認型（高點前後才出現）
# 回測（1985 年起）：分數 ≥ 50 時，之後 12 個月 S&P 500 跌 ≥ 15% 的比例約 4 成；< 20 時約 3%。
#   但多數在高點前後 0–3 個月才升高，不是 6–12 個月前的預告。詳見 docs/股市風險回測.md
market_risk:
  smooth_months: 3
  levels: {watch: 30, warn: 40, confirm: 50}   # 🟡 觀察、🟠 警示、🔴 確認（平滑後分數）
  bear_gate: 20            # S&P 500 已從高點跌 ≥ 20%：視為「空頭進行中」，不再發出多轉空警示
  forward_months: 12       # 回測：之後幾個月內
  forward_drop: 15         #       下跌幾 % 算命中
  max_age_months: 3        # 資料超過幾個月沒更新就當作缺漏（從分母扣除）
  components:
    - {key: yc_inverted, type: lead,    weight: 1, months: 24}
    - {key: yc_resteep,  type: lead,    weight: 1, months: 24, low_months: 12, rise: 0.75}
    - {key: first_cut,   type: lead,    weight: 1, months: 24, hike: 1.0, recent: 6, max_cut: 1.5}
    - {key: credit,      type: lead,    weight: 1, months: 12, rise: 0.3}
    - {key: nfci,        type: lead,    weight: 1, months: 12, rise: 0.15}
    - {key: oil,         type: lead,    weight: 1, yoy: 40}
    - {key: claims,      type: confirm, weight: 1, months: 12, rise_pct: 10}
    - {key: sahm,        type: confirm, weight: 1, min: 0.3}
    - {key: trend,       type: confirm, weight: 1, ma_months: 10}
    - {key: sentiment,   type: confirm, weight: 1, months: 12, drop_pct: 15}

# ── 判斷參數 ──────────────────────────────────────────────────
params:
  core_cpi_band: [1.8, 3.0]       # 成長期依據 4：核心 CPI 年增率區間（%）
  investment_growth_min: 5        # 成長期依據 3：投資年增率門檻（%）
  # 復甦期依據 1：聯邦基金利率低點
  fed_cut_total_min: 1.0          # 條件 A：累計降息 ≥ 1.00 個百分點
  fed_cut_count_min: 2            # 條件 A：或連續降息 ≥ 2 次
  fed_hold_months: 3              # 條件 B：連續 ≥ 3 個月沒有再調降
  stimulus_months: 12             # 復甦期依據 9：過去 12 個月內有登記的刺激措施
  consecutive_months: 3           # 成長期依據 1、觸頂依據 1：連續 ≥ 3 個月
  # 榮景期 E1–E4
  gdp_growth_min: 3               # E1：實質 GDP 年增率 ≥ 3%
  cfnai_min: 0.2                  # E1：CFNAI 3 個月平均 ≥ +0.2
  sp500_near_high: 5              # E2：距離歷史高點 5% 以內
  sp500_yoy_min: 15               # E2：年增率 ≥ 15%
  cape_pctile: 80                 # E2：CAPE ≥ 第 80 百分位
  sentiment_pctile: 75            # E3：信心指數 ≥ 第 75 百分位
  sentiment_peak_min_pctile: 50   # E3：或符合 T3「高峰」且百分位 ≥ 50（2026-11 A5：排除 1992 年從谷底反彈、百分位僅 18.6 的「高峰」）
  risk_pctile: 20                 # E4：VIX、利差、NFCI 風險分項 ≤ 第 20 百分位
  risk_min_count: 2               # E4：3 項中至少 2 項
  # 觸頂依據 3：初領失業救濟金 U 型（週資料 4 週平均）
  u_lookback_months: 36           # 「本輪低點」= 過去 36 個月的最低點（需求文件未定義，Claude 暫定）
  u_new_low_months: 3             # 3-1：最近 3 個月內創新低 → 榮景期延長
  u_extend_quarters: 3            # 3-1：至少再延伸 3 季
  u_no_new_low_months: 6          # 3-2：≥ 6 個月沒有再創新低
  u_rise_pct: 15                  # 3-2：比低點高出 ≥ 15%
  u_rising_weeks: 8               # 3-2：4 週平均連續 ≥ 8 週上升
  # 觸頂依據 8：耐久財訂單（不含運輸）二度衝高
  surge_pct: 5                    # 「衝高」：6 個月累計成長 ≥ 5%
  surge_months: 6
  flat_pct: 1                     # 「趨於平緩」：3 個月變化在 ±1% 以內
  flat_months: 3                  #   且連續 ≥ 3 個月
  second_surge_within: 24         # 第一波開始後 24 個月內出現第二波
  second_surge_hold: 12           # 二度衝高成立後，依據維持成立 12 個月（需求文件未定義，Claude 暫定）
  # 觸頂依據 10：違約率
  default_rise_pp: 0.2            # 比過去 8 季低點高出 ≥ 0.2 個百分點
  default_lookback_q: 8
  # 衰退期 A1：2 次消費陡降（季資料年增率）
  drop_quarters: 4                # 第 1 次陡降：從頂點起 4 季
  drop_min_pp: 1.0                #   4 季內累計下降 ≥ 1 個百分點（Claude 依圖二暫定）
  drop_tolerance_pp: 0.3          #   容許單季持平或小幅反彈 ≤ 0.3 個百分點（1990、2008 年都有；Claude 暫定）
  second_drop_within: 4           # 之後 4 季內跌破第 1 次陡降結束時的數值
  drop_clear_pp: 1                # 回升 ≥ 1 個百分點就解除觀察
  a1_hold_quarters: 4             # A1 成立後維持 4 季（需求文件未定義，Claude 暫定）
  # 衰退期 A2：民間投資年增率
  invest_crash: -10               # 年增率 ≤ −10%
  invest_drop_pp: 5               # 或年增率 < 0 且過去 2 季內下降 ≥ 5 個百分點
  nfci_min: 0                     # A3：金融情勢指數 NFCI ≥ 此值（0＝歷史平均；正值＝比平均緊）
  # A4 就業惡化（任一成立）
  claims_rise_pct: 15             # 初領失業救濟金 3 個月平均比過去 claims_lookback 個月低點上升 ≥ 15%
  claims_lookback: 12
  sahm_min: 0.3                   # 或即時薩姆規則 ≥ 0.3（Sahm 原始的 0.5 是「衰退已開始」的門檻；這裡只當佐證，用 0.3）
  # 百分位（T7）：回測時只用當時以前的資料；1985 年初樣本太少，至少回看 10 年
  pctile_min_years: 10
  pctile_min_span: 10             # 序列開始後未滿 10 年不算百分位（2026-11 A5：VIX 1990 年起、Baa 利差 1986 年起，早期樣本太短）
  # 巴菲特指標（#30，額外參考，不影響階段判定）
  buffett_high: 133              # 高於此值：買股相對風險高
  buffett_safe: [70, 80]         # 落在此區間以下：相對安全
  # 股價對照圖（#M）：S&P 500 從前高（月平均）下跌幾 % 以上算「空頭」
  bear_market_drop: 20

# ── 通用趨勢判斷 T1–T7（需求文件第 5 節）────────────────────────
# 季資料把「月」改成「季」（依需求文件字面：6 季、24 季、12 季），且不取 3 期平均
trend:
  smooth: {M: 3, Q: 1}            # 3 個月平均；季資料用原始季值
  lag: 6                          # T1、T6：和 6 期前比較
  window: 24                      # T2–T5：過去 24 期的最高／最低點
  recent: 12                      # T4、T5：最高／最低點出現在過去 12 期內
  consecutive: 2                  # 連續 2 期
  band: {pp: 0.5, pct: 10, pt: 10}     # T2、T3：百分點類 ±0.5pp；其他 ±10%（指數類也用 10%，需求文件未定義）
  rebound: {pp: 1, pct: 5, pt: 3}      # T4、T5：反彈／回落幅度
  rise: {pp: 0.5, pct: 10, pt: 3}      # T6：上揚幅度（指數類 3 點為 Claude 暫定）
  max_age: {W: 3, M: 6, Q: 9}     # 資料超過這麼多個月沒更新，視為缺漏（從分母扣除）

# ── 資料發布延遲（月）：回測時，觀察期間結束後要等多久才算「當時已知」──────
# 例：月資料（零售、CPI）約在次月中公布 → 1；季資料（GDP）約在季後 1 個月公布 → 1
# 市場價格（利率、油價、股價、VIX）、初領失業救濟金、密西根與費城調查當月就有 → 程式內設為 0
# 違約率約在季後 2 個月公布 → 程式內設為 2。⚠️ 回測仍使用「修正後」的資料，不是當時的初值
release_lag: {W: 0, M: 1, Q: 1}

# ── 階段判定（需求文件第 3.0 節）────────────────────────────────
stage_rules:
  # 總覽頁的提醒文字（規則經回測調整後可刪除這一行）
  caveat: "階段判定已依 1985 年以來的回測調整參數（第 5 階段）：4 次衰退都有抓到，進入衰退期平均落後約 2 個月，沒有誤判（2026-11 加入金融情勢與就業惡化條件後）。但這是用修正後資料；改用當時公布的數值，2008 年晚 6 個月、2020 年晚 4 個月，2023 年誤判 2 次。只有 4 次衰退可供驗證，結果僅供參考，詳見「回測」分頁。"
  initial: {month: "1985-01", stage: growth}   # NBER：1985 年屬於擴張期，先設為成長期
  levels: {watch: 0.3333, warn: 0.5, confirm: 0.6667}   # 🟡 ≥ 1/3、🟠 ≥ 1/2、🔴 ≥ 2/3
  # ── 第 5 階段回測後的建議設定（改回需求文件原始規則：memory_months 1、min_stage_months 0、recession.rule spec、刪掉 enter_levels）──
  memory_months: 3        # 判斷依據「近 3 個月內曾成立」就計入（各項依據很少在同一個月同時成立）
  min_stage_months: 6     # 每個階段至少停留 6 個月才轉入下一階段（「確立衰退」不受限制）
  enter_levels:
    recovery: 0.4         # 衰退 → 復甦：12 項中 ≥ 40% 成立即確認（原本 2/3 在 1985 年以來幾乎不曾達到）
    growth: 0.5           # 復甦 → 成長：4 項中 ≥ 2 項（原本 3 項；復甦期「持續時間短暫」，3 項時曾卡在復甦期 3 年以上）
  recession:
    rule: corroborated    # spec：A1 成立即確認（需求文件原始規則）；corroborated：需要其他訊號佐證
    a2_within: 6          # A1 ＋ 近 6 個月內 A2 成立
    p3_within: 1          #   或 A1 ＋ 目前 U 型結構確立；或 A2 ＋ U 型結構確立
    top_within: 12        # 而且近 12 個月內，觸頂 10 項中
    top_min: 0.6          #   ≥ 60% 曾成立
    fin: A3               # 2026-11 加入：A3 金融情勢轉緊（NFCI ≥ params.nfci_min）可佐證 A1/A2，也可取代上面的觸頂門檻
                          #   回測：2008 年從落後 11 個月改善為 3 個月、2020 年從 4 個月改善為 0；刪掉這行即改回原規則
    employment: A4        # 2026-11 加入：確立衰退時 A4 就業惡化必須成立（排除 1987、2023 年誤判）；刪掉這行即改回原規則
  # 轉入某階段要看哪些判斷依據（多組時合併計算比例）
  enter:
    growth: [growth]
    boom: [boom_entry]
    recovery: [recovery, bottom]   # 衰退 → 復甦：復甦期 9 項＋落底 B 組 3 項合併（需求文件未定義合併方式，Claude 暫定）
    recession: [recession]         # 任何階段都可以直接轉入

# 各階段的投資方向（需求文件第 3 節，使用者個人整理的觀點）
stages:
  recovery:
    name: 復甦期
    trait: 景氣落底後開始復甦，持續時間短暫
    invest:
      - 股市在此階段相對被低估，適合進場。
      - 黃金可能需要出清。黃金只有在「通膨＋貨幣寬鬆」的環境下才有利上漲；景氣復甦後，金價表現多半不佳。
  growth:
    name: 成長期
    trait: 景氣緩步擴張，持續時間最長
    invest:
      - 股市：看似昂貴其實不貴，是最佳投資標的。企業獲利不斷增長，宜持續買進並持有股票。
      - 高收益債：違約率維持在穩定低檔，可以持續買進持有；成長期中後期違約率開始飆升，可以調整部位。
      - 無風險債券：升息循環會使債券價格下跌，應避免持有。
  boom:
    name: 榮景期
    trait: 景氣加速成長、資本市場熱絡、市場樂觀、風險意識被極度低估，最後觸頂
    equity_floor: [70, 50, 30]     # 進入榮景期第 1、2、3 年起的建議持股比例下限（%）
    invest:
      - 持續做多股票，但持股比例要逐年降低（70% → 50% → 30%），最低維持 30%。
      - 布局無風險債券，避開高收益債和原物料。此階段無風險債券價格波動大，須小心。
  recession:
    name: 衰退期
    trait: 景氣轉疲並衰退，之後落底
    invest:
      - 持有債券和美元。
      - 衰退初期高收益債容易大跌，也可以趁機布局。
      - 股市：是絕佳的入市時機，宜分批布局，把時間拉長。
      - 美元：避險心態會推升美元升值，衰退期可以考慮持有。

# ── 原始序列（抓取單位）──────────────────────────────────────────
# source: fred（FRED API）、shiller（席勒資料）或 yahoo（Yahoo Finance，FRED 沒有的指數才用）
# freq: D 日、W 週、M 月、Q 季
series:
  # #1 聯邦基金利率
  DFEDTARU:  {source: fred, name: 聯邦基金目標區間上限, freq: D, unit: "%", kind: rate}
  DFEDTARL:  {source: fred, name: 聯邦基金目標區間下限, freq: D, unit: "%", kind: rate}
  DFEDTAR:   {source: fred, name: 聯邦基金目標利率（2008 年以前）, freq: D, unit: "%", kind: rate}
  DFF:       {source: fred, name: 聯邦基金有效利率, freq: D, unit: "%", kind: rate}
  # #2、#3
  DGS10:        {source: fred, name: 10 年期公債殖利率, freq: D, unit: "%", kind: rate}
  MORTGAGE30US: {source: fred, name: 30 年房貸平均利率, freq: W, unit: "%", kind: rate}
  # #4a、#4b
  DCOILWTICO:    {source: fred, name: WTI 原油（日）, freq: D, unit: 美元/桶, kind: level}
  WTISPLC:       {source: fred, name: WTI 原油（月）, freq: M, unit: 美元/桶, kind: level}
  PPIACO:        {source: fred, name: PPI 全部商品, freq: M, unit: 指數 1982=100, kind: level}
  PALLFNFINDEXM: {source: fred, name: IMF 全球原物料價格指數, freq: M, unit: 指數 2016=100, kind: level}
  # #5、#6
