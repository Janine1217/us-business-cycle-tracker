<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美國景氣儀表板</title>
<meta name="description" content="美國景氣循環追蹤：指標總表、趨勢圖與景氣階段判斷，每日更新。">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="景氣儀表板">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>美國景氣循環儀表板</h1>
    <p class="meta" id="meta">載入中…</p>
  </div>
  <nav class="tabs wrap" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">總覽</button>
    <button role="tab" data-tab="table" aria-selected="false">指標總表</button>
    <button role="tab" data-tab="charts" aria-selected="false">趨勢圖</button>
    <button role="tab" data-tab="backtest" aria-selected="false">回測</button>
    <button role="tab" data-tab="todo" aria-selected="false">待調整</button>
  </nav>
</header>

<main class="wrap">
  <section id="overview" class="panel">
    <div class="card stage-card">
      <div class="stage-grid">
        <div>
          <div class="stage-label">目前景氣階段</div>
          <div class="stage-value" id="stage-name">—</div>
          <p class="stage-reason" id="stage-reason"></p>
          <p class="muted small" id="stage-since"></p>
        </div>
        <svg class="cycle" viewBox="0 0 320 200" role="img" aria-label="景氣循環位置圖">
          <path d="M20 150 C 70 150, 80 40, 160 40 S 250 150, 300 150" fill="none" class="cycle-line"/>
          <g class="cycle-pt" data-stage="recovery"><circle cx="62" cy="118" r="7"/><text x="62" y="176">復甦期</text></g>
          <g class="cycle-pt" data-stage="growth"><circle cx="112" cy="62" r="7"/><text x="104" y="28">成長期</text></g>
          <g class="cycle-pt" data-stage="boom"><circle cx="190" cy="46" r="7"/><text x="200" y="22">榮景期</text></g>
          <g class="cycle-pt" data-stage="recession"><circle cx="262" cy="120" r="7"/><text x="262" y="176">衰退期</text></g>
        </svg>
      </div>
    </div>
    <div class="card" id="caveat-card" hidden></div>
    <div class="card">
      <h2>轉折訊號</h2>
      <div id="signals"></div>
    </div>
    <div class="card">
      <h2>各階段判斷依據</h2>
      <p class="muted small">點開可看逐項明細與數值。✓ 成立｜△ 接近｜✕ 未成立｜— 資料缺漏（從分母扣除）</p>
      <div id="groups"></div>
    </div>
    <div class="card">
      <h2 id="invest-title">投資方向</h2>
      <div id="invest"></div>
      <p class="disclaimer-inline">僅供參考，非投資建議。投資方向為使用者個人整理的觀點。</p>
    </div>
    <div class="card">
      <h2>階段時間軸（系統判定 vs NBER 衰退期間）</h2>
      <div id="timeline"></div>
      <details class="events"><summary>階段轉換與訊號歷史</summary><div id="events"></div></details>
    </div>
    <div class="card">
      <h2>資料狀態</h2>
      <div id="health"></div>
    </div>
  </section>

  <section id="table" class="panel" hidden>
    <div class="chips" id="stage-filter" role="group" aria-label="依所屬階段篩選"></div>
    <div id="indicator-list" class="ind-list"></div>
  </section>

  <section id="charts" class="panel" hidden>
    <div class="chips" id="chart-filter" role="group" aria-label="依所屬階段篩選"></div>
    <div class="stage-legend" id="stage-legend"></div>
    <div id="chart-list"></div>
  </section>
  <section id="backtest" class="panel" hidden></section>
  <section id="todo" class="panel" hidden></section>
</main>

<footer class="wrap foot">
  資料來源：FRED（聖路易聯邦準備銀行）、Robert Shiller 美股資料。灰色陰影為 NBER 認定的衰退期間（FRED：<a href="https://fred.stlouisfed.org/series/USREC" target="_blank" rel="noopener">USREC</a>）。
</footer>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
